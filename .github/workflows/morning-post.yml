name: Bangkok Place Morning Post

on:
  # Bangkok 05:00 == UTC 22:00 (previous day).
  # ⚠️ Active: requires the THREADS_ACCESS_TOKEN repository secret to be set,
  # or scheduled runs fail every morning. Posts one Bangkok "place of the day"
  # (50-place rotation), Korean only — no translation, so no ANTHROPIC/WAQI keys.
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print the posts without publishing to Threads'
        type: boolean
        default: true

# Don't let a slow run overlap the next one.
concurrency:
  group: morning-post
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Post place of the day to Threads
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          # Manual runs default to a safe dry-run; scheduled runs always publish.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Running in dry-run mode (no publishing)."
            npm run start:places -- --dry-run
          else
            echo "Publishing to Threads."
            npm run start:places
          fi
